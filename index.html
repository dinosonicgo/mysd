<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>個人助理 - 裝置選擇</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background-color: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        h1 { color: #ffffff; margin-bottom: 30px; }
        .device-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .device-link { display: block; padding: 20px; background-color: #333; color: #00aaff; text-decoration: none; border-radius: 8px; font-size: 1.2em; font-weight: bold; transition: background-color 0.3s, transform 0.2s; }
        .device-link:hover { background-color: #00aaff; color: #ffffff; transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>選擇要連線的裝置</h1>
        <div class="device-grid">
            <a href="./RTX2060.html" class="device-link">RTX2060</a><a href="./RTX3050.html" class="device-link">RTX3050</a>
        </div>
    </div>
</body>
</html>
